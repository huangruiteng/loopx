name: Contributor task
description: Publish, claim, or discuss a public contributor task.
title: "[Task]: "
labels: ["triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for public, repository-safe work. Do not paste private benchmark traces, verifier output, raw agent sessions, credentials, internal document links, or local runtime state.
  - type: input
    id: task_id
    attributes:
      label: Task ID or area
      description: Use the board ID if one exists, such as GH-C01, or a short area name.
      placeholder: "GH-C01 or area: docs"
  - type: dropdown
    id: direction
    attributes:
      label: Technical direction
      description: Choose the closest current program. This routes discussion; it does not make a draft implementation-ready.
      options:
        - Core control-plane hardening
        - Long-horizon benchmark evidence
        - Operator surface and IM integration
        - Shared Goal Authority and cross-host coordination
        - Architecture and research incubator
        - Unsure; maintainer triage needed
    validations:
      required: true
  - type: dropdown
    id: intent
    attributes:
      label: Intent
      options:
        - I want to claim an existing task
        - I am proposing a new task
        - I need design feedback before implementation
        - I found a bug
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Goal and acceptance gap
      description: Name the current request or contract, affected user/caller and observable result. Link an existing goal/direction when relevant; a roadmap id is not required.
      placeholder: |
        Goal/source:
        Current gap:
        Accepted outcome (before → after):
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
      description: Choose a complete useful slice. State ownership, dependencies, non-goals and any staged remainder; do not split only to minimize file or PR size.
      placeholder: |
        In scope / owner:
        Existing related work / dependencies:
        Out of scope:
        If staged: useful delta, remaining gap, next owner/task, and why this boundary:
    validations:
      required: true
  - type: input
    id: target_base
    attributes:
      label: Intended base branch
      description: Usually main. Name an integration branch when the direction tracker requires one.
      placeholder: "main or frontend-control-plane-im-prototype-rfc"
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Relevant files or commands
      description: Link likely files, docs, examples, or CLI commands.
      placeholder: |
        - README.md
        - examples/demo-cli-smoke.py
        - loopx check --scan-root .
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: What independently observable result proves completion? Include the actual entrypoint/readback and relevant failure case; passing a test count is insufficient.
      placeholder: |
        Accepted result and independent oracle:
        Actual entrypoint / safe command:
        Negative or recovery case:
        Frontend / Lark / CLI impact or verified N/A:
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Public/private boundary
      options:
        - label: This issue does not include private benchmark traces, verifier output, credentials, internal document links, raw agent sessions, or local runtime state.
          required: true
        - label: I will not run or duplicate maintainer-owned benchmark cases unless a maintainer explicitly splits out a public task.
          required: true
