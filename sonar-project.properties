sonar.organization=huangruiteng
sonar.projectKey=huangruiteng_loopx
sonar.projectName=LoopX

# Public project links
sonar.links.homepage=https://github.com/huangruiteng/loopx
sonar.links.scm=https://github.com/huangruiteng/loopx

sonar.sourceEncoding=UTF-8

# Analyzed surfaces: Python product core, TypeScript/JavaScript product
# surfaces, and helper scripts. Generated frontend bundles, legacy
# deprecate/, and non-analyzed runtimes (Rust/Tauri) are excluded.
sonar.sources=loopx,apps,scripts
sonar.tests=tests
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/src-tauri/**,loopx/web/chat/assets/**,**/*.min.js,deprecate/**
# These settings components are declarative React wiring. They are exercised by
# the packaged dashboard acceptance flow, while the repository's dashboard
# coverage job instruments the framework-neutral data surface only.
sonar.coverage.exclusions=apps/**/*.test.*,apps/**/smoke/**,apps/**/features/personal-workspace/periodic-report-schedule-field.tsx,apps/**/features/personal-workspace/capability-configuration-fields.tsx,apps/**/features/personal-workspace/machine-configuration-settings.tsx

# Python
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml

# TypeScript/JavaScript product coverage
sonar.javascript.lcov.reportPaths=coverage/control-plane/lcov.info,coverage/dashboard/lcov.info,coverage/dashboard/browser-lcov.info

# Non-blocking by default: report findings, never gate the workflow.
sonar.qualitygate.wait=false
